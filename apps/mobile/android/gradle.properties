# ==================== Android 编译开关 ====================
# Android Studio 中单独设置的同名选项会覆盖本文件，排查不同电脑结果不一致时要同时检查两处。

# JVM（运行 Gradle 的 Java 环境）最多使用 2 GiB 内存，元数据最多使用 512 MiB。
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# 并行编译仍是试验功能，本项目模块之间没有验证为完全独立，因此保持关闭。
# org.gradle.parallel=true

# AndroidX 是现代 Android 公共组件命名方式，React Native 依赖需要它保持开启。
android.useAndroidX=true

# 同时生成常见真机与模拟器处理器版本；命令行可临时只编一种以缩短本地等待时间。
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# 新架构会启用 TurboModules 和 Fabric，也就是新版原生功能连接与界面绘制方式。
newArchEnabled=true

# Hermes 是默认 JavaScript 执行引擎；改为 false 后会回退到 app/build.gradle 中声明的 JSC。
hermesEnabled=true

# 全屏绘制暂时关闭，页面安全区由 React Native 组件管理，避免内容意外压到系统状态栏下面。
edgeToEdgeEnabled=false
