// ==================== Android 应用模块 ====================
// 三个插件分别负责生成安装包、编译 Kotlin 原生代码和接入 React Native 构建流程。
apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// ---------- React Native 构建 ----------
// 当前只启用原生依赖自动连接，其余路径和打包选项继续使用官方默认值。
react {
    // 文件夹位置：下面保留官方示例，只有目录结构改变后才需要取消注释。
    // 项目根目录，也就是 package.json 所在位置；默认值为 ../..。
    // root = file("../../")
    // react-native 软件包目录；默认值为 ../../node_modules/react-native。
    // reactNativeDir = file("../../node_modules/react-native")
    // Codegen（根据类型说明生成原生连接代码的工具）目录；默认值如下。
    // codegenDir = file("../../node_modules/@react-native/codegen")
    // React Native 命令行入口；默认值如下。
    // cliFile = file("../../node_modules/react-native/cli.js")

    // 可调试版本不会把 JavaScript 和图片提前打进安装包，而是从开发服务器读取。
    // 若以后增加 lite 或 prod 等版本名称，必须把对应调试版本补到下面的列表。
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    // 打包选项：当前全部沿用默认值，示例只用于确有自定义需求时参考。
    // 执行 JavaScript 工具的 Node 命令和附加参数，默认只有 node。
    // nodeExecutableAndArgs = ["node"]
    //
    // 打包命令默认是 bundle。
    // bundleCommand = "ram-bundle"
    //
    // 命令行配置文件路径默认留空。
    // bundleConfig = file(../rn-cli.config.js)
    //
    // 生成的 JavaScript 资源文件名称。
    // bundleAssetName = "MyApplication.android.bundle"
    //
    // 打包入口默认查找 index.android.js 或 index.js。
    // entryFile = file("../js/MyApplication.android.js")
    //
    // 传给打包命令的额外参数，当前不需要。
    // extraPackagerArgs = []

    // Hermes（手机中执行 JavaScript 的引擎）编译器默认使用 hermesc。
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    // 默认参数会优化代码并生成便于定位错误位置的映射文件。
    // hermesFlags = ["-O", "-output-source-map"]

    // 自动连接会扫描依赖并把需要的 Android 原生模块加入安装包。
    autolinkLibrariesWithApp()
}

// Proguard（压缩并改写原生代码的工具）暂时关闭，避免早期阶段因缺少保留规则造成正式包崩溃。
def enableProguardInReleaseBuilds = false

// Hermes 被关闭时才改用 JSC（另一种 JavaScript 执行引擎）。
// 当前选择体积较小的普通版本；带完整多语言日期规则的 intl 版本每种处理器约多 6 MiB。
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// ==================== 安装包设置 ====================
android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.nutritime"
    defaultConfig {
        applicationId "com.nutritime"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // 手机和手表使用不同编号区间，避免同包名产物安装或发布时发生版本冲突。
        versionCode 1000001
        versionName "1.0"
    }
    sourceSets {
        main {
            // 直接把 mobile/assets 打进安装包，字体仍只维护一份，不复制到 Android 专用目录。
            assets.srcDirs += ["../../assets"]
        }
    }
    signingConfigs {
        // debug.keystore 只是公开的本地调试证书，不能当作正式发布身份使用。
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // 当前项目尚未配置正式证书，所以 release 暂借调试证书才能在本机安装。
            // 真正上架前必须替换成私密正式证书，不能用这个包发布到应用商店。
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // ---------- 应用运行依赖 ----------
    // React Native 版本由上方插件根据 package.json 统一决定，这里不再手写另一份版本号。
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
